<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactile Tic-Tac-Toe</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Tactile Tic-Tac-Toe</h1>
      <p class="subtitle">A clean, responsive tic-tac-toe game with an unbeatable AI.</p>
    </header>

    <section class="controls">
      <div class="mode-toggle">
        <button id="mode-2p" class="mode-btn active" data-mode="2p">2 Players</button>
        <button id="mode-ai" class="mode-btn" data-mode="ai">vs Computer</button>
      </div>
      <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </section>

    <section class="status-bar">
      <div id="turn-indicator" class="turn-indicator">X's turn</div>
    </section>

    <section class="board-container">
      <div id="board" class="board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>
    </section>

    <section class="scoreboard">
      <div class="score x-score">
        <span class="score-label">X Wins</span>
        <span id="score-x" class="score-value">0</span>
      </div>
      <div class="score draw-score">
        <span class="score-label">Draws</span>
        <span id="score-draw" class="score-value">0</span>
      </div>
      <div class="score o-score">
        <span class="score-label">O Wins</span>
        <span id="score-o" class="score-value">0</span>
      </div>
    </section>

    <section class="actions">
      <button id="reset-btn" class="reset-btn">New Game</button>
    </section>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
